---
# S3 Credentials Secret for CDI Image Import
#
# Required for importing Windows golden images from S3
#
# Usage:
#   1. Base64 encode your credentials:
#      export AWS_ACCESS_KEY_ID="AKIAIOSFODNN7EXAMPLE"
#      export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
#      echo -n "$AWS_ACCESS_KEY_ID" | base64
#      echo -n "$AWS_SECRET_ACCESS_KEY" | base64
#
#   2. Replace values below and apply:
#      oc apply -f s3-credentials-secret.yaml
#

apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: openshift-virtualization-os-images
  labels:
    app: virtualization
    component: image-storage
type: Opaque
data:
  # Base64 encoded AWS access key ID
  accessKeyId: REPLACE_WITH_BASE64_ACCESS_KEY

  # Base64 encoded AWS secret access key
  secretKey: REPLACE_WITH_BASE64_SECRET_KEY

# Alternative format for AWS credentials file
# stringData:
#   credentials: |
#     [default]
#     aws_access_key_id = AKIAIOSFODNN7EXAMPLE
#     aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
